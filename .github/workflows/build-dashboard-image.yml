name: Build dashboard image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: dashboard-image-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
      source_sha: ${{ steps.image.outputs.source_sha }}

    env:
      IMAGE_REPOSITORY: ghcr.io/naveengumaste/service-status-dashboard

    steps:
      - name: Check out dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NaveenGumaste/service-status-dashboard
          ref: main
          path: app
          ssh-key: ${{ secrets.APP_SOURCE_SSH_KEY }}
          persist-credentials: false

      - name: Check out GitOps history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: gitops-state
          fetch-depth: 0
          persist-credentials: false

      - name: Check for a new app revision
        id: revision
        run: |
          app_sha=$(git -C app rev-parse HEAD)
          prior=$(git -C gitops-state log -1 --format=%H -S "sha-$app_sha" -- charts/service-status-dashboard/values.yaml)
          if [[ -n "$prior" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "App commit $app_sha is already recorded in GitOps history"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.revision.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Lint and test
        if: steps.revision.outputs.build == 'true'
        working-directory: app/web
        env:
          npm_config_script_shell: /bin/bash
        run: |
          npm ci
          npm run lint
          npm test
          npm run typecheck

      - name: Build and smoke-test the image
        if: steps.revision.outputs.build == 'true'
        id: image
        run: |
          app_sha=$(git -C app rev-parse HEAD)
          image="${IMAGE_REPOSITORY}:sha-${app_sha}"
          docker build --tag "$image" --label "org.opencontainers.image.revision=$app_sha" ./app/web

          container=$(docker run --detach --publish 127.0.0.1:3000:3000 "$image")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for probe in health ready; do
            curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
              --output /dev/null "http://127.0.0.1:3000/api/$probe"
          done

          printf 'ref=%s\nsource_sha=%s\n' "$image" "$app_sha" >> "$GITHUB_OUTPUT"

      - name: Publish to GHCR
        if: steps.revision.outputs.build == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
          APP_SHA: ${{ steps.image.outputs.source_sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          printf 'Image: %s\n\nApp commit: %s\n' "$IMAGE" "$APP_SHA" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote image in Helm values
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.image_ref != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      APP_SHA: ${{ needs.build.outputs.source_sha }}

    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update and commit Helm values
        run: |
          chart=charts/service-status-dashboard
          values="$chart/values.yaml"
          export IMAGE_REPOSITORY="${IMAGE_REF%:*}"
          export IMAGE_TAG="${IMAGE_REF##*:}"
          export RELEASE_ID="ghcr-${APP_SHA:0:7}"

          if yq -e '
            .image.repository == strenv(IMAGE_REPOSITORY) and
            .image.tag == strenv(IMAGE_TAG) and
            .image.pullSecret == "ghcr-pull" and
            .app.releaseId == strenv(RELEASE_ID) and
            .app.commitSha == strenv(APP_SHA)
          ' "$values" >/dev/null; then
            echo "Helm already selects $IMAGE_REF"
            exit 0
          fi

          yq -i '
            .image.repository = strenv(IMAGE_REPOSITORY) |
            .image.tag = strenv(IMAGE_TAG) |
            .image.pullSecret = "ghcr-pull" |
            .app.releaseId = strenv(RELEASE_ID) |
            .app.commitSha = strenv(APP_SHA)
          ' "$values"

          helm lint "$chart" --strict
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$values"
          git commit -m "chore: promote dashboard image ${APP_SHA:0:7}"
          git push origin HEAD:main
