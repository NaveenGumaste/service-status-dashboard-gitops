name: Build dashboard image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE_REPOSITORY: ghcr.io/naveengumaste/service-status-dashboard

    steps:
      - name: Check out dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NaveenGumaste/service-status-dashboard
          ref: main
          path: app
          ssh-key: ${{ secrets.APP_SOURCE_SSH_KEY }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Lint and test
        working-directory: app/web
        env:
          npm_config_script_shell: /bin/bash
        run: |
          npm ci
          npm run lint
          npm test
          npm run typecheck

      - name: Build and smoke-test the image
        id: image
        run: |
          app_sha=$(git -C app rev-parse HEAD)
          image="${IMAGE_REPOSITORY}:sha-${app_sha}"
          docker build --tag "$image" --label "org.opencontainers.image.revision=$app_sha" ./app/web

          container=$(docker run --detach --publish 127.0.0.1:3000:3000 "$image")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for probe in health ready; do
            curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
              --output /dev/null "http://127.0.0.1:3000/api/$probe"
          done

          printf 'ref=%s\nsource_sha=%s\n' "$image" "$app_sha" >> "$GITHUB_OUTPUT"

      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
          APP_SHA: ${{ steps.image.outputs.source_sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          printf 'Image: %s\n\nApp commit: %s\n' "$IMAGE" "$APP_SHA" >> "$GITHUB_STEP_SUMMARY"
